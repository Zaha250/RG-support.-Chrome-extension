<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вставка текста</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="src/css/index.css">
</head>
<body>
    <div class="root">
        <div class="template-search">
            <label class="template-search__label" for="template-search">Поиск по шаблонам</label>
            <input
                class="template-search__input"
                id="template-search"
                type="search"
                placeholder="Введите текст шаблона"
                autocomplete="off"
                aria-controls="templates-list"
            >
        </div>
        <p class="templates-empty" role="status" hidden>Шаблоны не найдены.</p>
        <ul class="list-templates" id="templates-list">

        </ul>
    </div>

<script type="module" src="src/js/popup.js"></script>
</body>
</html>
